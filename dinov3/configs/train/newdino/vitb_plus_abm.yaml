# +ABM -- Anatomy-Biased Masking on top of the baseline, without DAVC.
# Off the cumulative chain; it is the second cell of the 2x2 that shows ABM
# contributes independently rather than only in the presence of DAVC.
#
# Generated by make_configs.py -- edit the template there, not this file.
# Ablation axes:  DAVC = radiograph-consistent augmentation + view-aware strength +
# n-TCC local views (xiaorong shorthand A+B).  ABM = anatomy-biased masked-token
# sampling (xiaorong shorthand C). Everything outside the augmentation / masking /
# crops blocks is identical across all configs in this folder, and matches
# xiaorong/vitb_plus_AB_C.yaml. See toothdino_github_release_20260713/docs/CHANGES.md.

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: "/data/tangkun/project/DEIMv2/ckpts/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"
  DTYPE: float32

compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP

dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 16384
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  force_weight_norm: false

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 16384
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048

augmentation:
  # DAVC off: natural-image augmentation, no radiograph-specific transforms.
  medical_augmentation: false
  mode: natural

masking:
  # ABM on. The prior lives on the GLOBAL VIEW patch grid, and global views are random
  # resized crops, so the dental band does not sit at the centre of a view. Measured over
  # 395 panoramas / 790 global views / 4930 tooth anchors visible inside a view, anchors
  # land at x = 0.504 +- 0.259 and y = 0.602 +- 0.115. Recentring raises the prior mass
  # falling on real tooth anchors from 0.617 to 0.749 (+21%). Widening further keeps
  # raising that number but flattens the prior until it stops being a prior, so these are
  # the smallest values reaching ~0.75. Regenerate with dinov3/visualize_abm_prior.py.
  bias_mode: anatomy_biased
  bias_strength: 2.5
  focus_center_x: 0.5
  focus_center_y: 0.61
  focus_spread_x: 0.40
  focus_spread_y: 0.25

anatomy_guided_masking:
  enabled: false

auxiliary:
  flip_prediction:
    enabled: false
    loss_weight: 0.0

train:
  batch_size_per_gpu: 64
  dataset_path: "MyDINOSet:root=/data/tangkun/pXray/All/train/pXray/"
  output_dir: /data/tangkun/project/dinov3newimprove/dinov3/output/newdino/vitb_plus_abm
  saveckp_freq: 20
  seed: 0
  num_workers: 8
  OFFICIAL_EPOCH_LENGTH: 223
  monitor_gradient_norm: false
  chunk_schedule: []
  cache_dataset: true
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  checkpointing: false
  checkpointing_full: false
  compile: true
  cudagraphs: false
  sharded_eval_checkpoint: false

student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  patch_drop: 0.0
  pretrained_weights: "/data/tangkun/project/DEIMv2/ckpts/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"
  ffn_layer: mlp
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: ""
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 4
  mask_k_bias: true
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: null
  pos_embed_rope_dtype: bf16
  fp8_enabled: false
  fp8_filter: "blocks"

teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 10
  in_chans: 3

distillation:
  enabled: false
  full_cfg_path: ""
  checkpoint_path: ""

multidistillation:
  enabled: false

hrft:
  enabled: false
  checkpoint_path: ""

optim:
  epochs: 200
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.4
  lr: 0.0001
  warmup_epochs: 10
  min_lr: 1.0e-06
  schedule_trunc_extra: 0.0
  clip_grad: 3.0
  freeze_last_layer_epochs: 2
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9
  multi_tensor_optim: true
  dump_fsdp_weights_path: ""
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 8
  global_crops_size: 256
  local_crops_size: 128
  localcrops_subset_of_globalcrops: false
  # DAVC off: official DINOv3 random local crops, official scale range.
  local_crops_scale: [0.05, 0.32]
  local_crop_strategy: random
  share_color_jitter: false
  horizontal_flips: true
  gram_teacher_crops_size: null
  gram_teacher_no_distortions: false
  rgb_mean: [0.485, 0.456, 0.406]
  rgb_std: [0.229, 0.224, 0.225]

evaluation:
  # Keep intermediate eval checkpoints so dense-feature quality can be measured across
  # training with diagnose_patch_correspondence.py. DINOv3 enables Gram anchoring only
  # after ~1.01M iterations (dinov3_vit7b16_gram_anchor.yaml, gram.it_first_update);
  # this run is 44.6k iterations, so whether the degradation Gram fixes happens at all
  # at this scale is an open question that these checkpoints answer.
  eval_checkpoint_max_to_keep: 8
  eval_period_iterations: 2000
  low_freq_every: 5
  config_files:
    high_freq: benchmark_high_frequency.yaml
    low_freq: benchmark_low_frequency.yaml

checkpointing:
  period: 5575
  max_to_keep: 3
  keep_every: 99999999999999999
